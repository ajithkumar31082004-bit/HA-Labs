<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" rx="28" fill="#060913"/>
  <defs>
    <linearGradient id="ha-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Outer Triangle A-Frame -->
  <path d="M60 22 L24 95 L96 95 Z" stroke="url(#ha-glow)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Middle Crossbar -->
  <line x1="36" y1="70" x2="84" y2="70" stroke="url(#ha-glow)" stroke-width="7" stroke-linecap="round"/>
  <!-- Center Pin Node -->
  <line x1="60" y1="70" x2="60" y2="46" stroke="url(#ha-glow)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="60" cy="42" r="5" fill="url(#ha-glow)"/>
  <!-- Two lower vertical legs forming H -->
  <line x1="45" y1="72" x2="45" y2="97" stroke="url(#ha-glow)" stroke-width="7" stroke-linecap="round"/>
  <line x1="75" y1="72" x2="75" y2="97" stroke="url(#ha-glow)" stroke-width="7" stroke-linecap="round"/>
  <!-- Circuit Nodes -->
  <circle cx="60" cy="19" r="6" stroke="url(#ha-glow)" stroke-width="4" fill="#060913"/>
  <circle cx="20" cy="97" r="6" stroke="url(#ha-glow)" stroke-width="4" fill="#060913"/>
  <circle cx="100" cy="97" r="6" stroke="url(#ha-glow)" stroke-width="4" fill="#060913"/>
</svg>
